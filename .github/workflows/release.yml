name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Analyze, test, and build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test bookshelf update ordering
        run: flutter test test/bookshelf_update_order_test.dart --no-pub

      - name: Test COPY token profile resolution
        shell: pwsh
        run: flutter test test/copy_account_login_test.dart --no-pub --plain-name "token validation fetches the matching profile with dynamic COPY headers"

      - name: Test Windows login focus stability
        shell: pwsh
        run: flutter test test/copy_account_login_test.dart --no-pub --plain-name "login username field keeps focus while text changes"

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Verify Kira Tablet executable
        shell: pwsh
        run: |
          $exe = 'build/windows/x64/runner/Release/KiraTablet.exe'
          if (-not (Test-Path $exe)) {
            throw "Missing Windows build artifact: $exe"
          }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v6
        with:
          name: kira-tablet-windows-ci
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14
